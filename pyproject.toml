[project]
name = "whisper-transcribe"
version = "0.1.0"
description = "教会音声のWhisperローカル文字起こし (WSL2 + CUDA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-whisper==20250625",
    "torch>=2.11.0",
]

[project.scripts]
whisper-transcribe = "whisper_transcribe.create_sound_to_text:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
